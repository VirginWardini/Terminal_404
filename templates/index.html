<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TERMINAL 404</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="window">
    <header class="titlebar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="title">halcyon-node-404 &mdash; secure session</span>
      <span class="status" id="status">clues: 0</span>
    </header>
    <section class="screen" id="screen" aria-live="polite">
      <div id="output"></div>
      <div class="inputline">
        <span id="prompt" class="prompt"></span>
        <span class="typed"><span id="mirror"></span><span class="cursor"></span></span>
        <input id="input" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" aria-label="Terminal command input" autofocus>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='terminal.js') }}"></script>
</body>
</html>
